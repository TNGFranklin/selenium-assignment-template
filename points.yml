# ============================================================
# Selenium Assignment - Self Assessment
# ============================================================

student:
  website_under_test: "https://www.globalsqa.com/angularJs-protractor/BankingProject/#/login"


# ----------------------------------------------------------
# AI usage
# ----------------------------------------------------------
ai_usage:
  used: true
  tools: "Claude"
  description: "Used Claude to generate initial Page Object classes and test
                structure for XYZ Bank (GlobalSQA). Reviewed and understood
                each method, verified selectors against the live site."

# ----------------------------------------------------------
# Quality requirements (gatekeepers)
# ----------------------------------------------------------
quality:
  gitignore:
    done: true
    description: "Unnecessary files are ignored (.gitignore covers build output, IDE files, etc.)"

  structured_code:
    done: true
    description: "Code is organized into classes and functions, not one big file"

  readable_code:
    done: true
    description: "Function and method names describe what they do, test suite reads like a test description"

  low_redundancy:
    done: true
    description: "Shared logic extracted into BasePage, BaseTest, and helper methods"

# ----------------------------------------------------------
# Basic tasks (B)
# ----------------------------------------------------------
basic:
  login_form:
    done: true
    description: "Customer login via dropdown form and submit"

  form_with_user:
    done: true
    description: "Deposit and withdrawal forms that require a logged-in customer"

  logout:
    done: true
    description: "Customer logout verified by checking login page reappears"

  fill_input:
    count: 8
    description: "First Name, Last Name, Post Code, amount (deposit), amount (withdraw), search, account select, currency select"

  send_form:
    count: 5
    description: "Customer login, Add Customer, Open Account, Deposit, Withdrawal"

  static_page_test:
    done: true
    description: "Verify XYZ Bank login page has correct buttons and static content"

  multiple_page_test:
    done: true
    description: "Iterate over login/manager/customer URL fragments and verify each loads"

  complex_xpath:
    count: 6
    description: "ng-click buttons, table cells, delete buttons, sort headers, transaction rows, headings"

  textarea:
    done: false
    description: "XYZ Bank does not have a textarea element"

  dropdown:
    done: true
    description: "Customer name dropdown (Select) and currency dropdown (Select)"

  radio_button:
    done: false
    description: "XYZ Bank does not use radio buttons"

  at_least_4_classes:
    done: true
    description: "Project has at least 4 Java classes"

  at_least_6_classes:
    done: true
    description: "Project has at least 6 Java classes"

  at_least_8_classes:
    done: true
    description: "Project has at least 8 Java classes"

  explicit_wait:
    done: true
    description: "WebDriverWait with ExpectedConditions used in BasePage"

  page_title:
    done: true
    description: "getTitle() verified on login page and account page"

  page_object_pattern:
    done: true
    description: "LoginPage, ManagerPage, CustomerAccountPage, BasePage all used"

  base_page_class:
    done: true
    description: "BasePage class extended by all page classes"

  readable_tests:
    done: true
    description: "All test methods have descriptive names matching what they test"

# ----------------------------------------------------------
# Advanced tasks (A)
# ----------------------------------------------------------
advanced:
  webdriver_config:
    done: true
    description: "ChromeOptions with window size, notifications disabled, sandbox flags"

  cookie_manipulation:
    done: true
    description: "Add, read, and delete cookies on XYZ Bank site"

  history_test:
    done: true
    description: "back() and forward() navigation tested between login and account pages"

  random_data:
    done: true
    description: "Random customer name, post code, and deposit amounts generated per test run"

  config_file:
    done: true
    description: "config.properties stores base URL, browser, timeouts — read by ConfigReader"

  javascript_executor:
    done: true
    description: "JavascriptExecutor scrollIntoView used on account page"

  screenshot_on_failure:
    done: true
    description: "ScreenshotListener implements ITestListener and saves PNG on test failure"

  headless_execution:
    done: true
    description: "Headless mode enabled via config.properties headless=true"
